# Local LiveKit SFU for the live classroom (dev keys: devkey / secret).
# For production, use LiveKit Cloud or a self-hosted LiveKit with TURN + real keys.
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
